name: 'Probe A: smoke fails (dispatch skip=true is the override)'
on:
  push:
    branches: [1170-gate-probe]
  workflow_dispatch:
    inputs:
      skip_playwright_tests:
        type: boolean
        default: false

jobs:
  tests:
    uses: ./.github/workflows/probe-stub.yml

  get-pr-labels:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.find_pr.outputs.labels }}
    steps:
      - id: find_pr
        run: echo "labels=" >> "$GITHUB_OUTPUT"

  build:
    needs: [tests, get-pr-labels]
    if: ${{ !contains(needs.get-pr-labels.outputs.labels, 'skip-deploy') }}
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  smoke:
    needs: build
    if: ${{ !inputs.skip_playwright_tests }}
    uses: ./.github/workflows/probe-stub.yml
    with:
      image: freelawproject/litigant-portal:${{ needs.build.outputs.sha_short }}-prod
      fail: true

  setup-deploy:
    needs: [get-pr-labels, build, smoke]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "setup-deploy ${{ needs.build.outputs.sha_short }}"

  deploy-web:
    needs: [get-pr-labels, build, setup-deploy]
    if: ${{ !cancelled() && needs.setup-deploy.result == 'success' && !contains(needs.get-pr-labels.outputs.labels, 'skip-web-deploy') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo deploy-web
